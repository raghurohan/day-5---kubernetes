name: docker build

on:
- workflow_dispatch

jobs:
 build:
  runs-on: ubuntu-latest
  env:
   DOCKER_IMAGE: sonalivarshney/sampleapp

  steps:
    - name: checkout
      uses: actions/checkout@v5.0.0
    - name: Docker Login
      uses: docker/login-action@v3.5.0
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}

    - name: Build Docker image
      run: |
        docker build -t myapp .
        docker tag myapp:latest ${DOCKER_IMAGE}:latest
        docker push ${DOCKER_IMAGE}:latest

    - name: Setup kubectl
      uses: Azure/setup-kubectl@v4.0.0
      with:
        version: latest # Version of kubectl.default is latest

    - name: Setup minikube
      run: |
        minikube start # since it is on gitub hosted runner, minikube is pre installed.If running on self hosted runner, then need to install minkube using actions. 
        kubectl config use-context minikube #to ensure that subsequent kubectl commands interact with the Minikube cluster.
                 
        echo "Waiting for Minikube pods to become ready..."
          
          # This loop waits up to 5 minutes for control plane pods to become ready
        timeout 300s bash -c '
          until kubectl get pods --all-namespaces | grep "Running" | grep "1/1" | grep -q "kube-apiserver"; do
            echo "Waiting for kube-apiserver to be ready..."
            sleep 5
          done
            
        kubectl apply -f deployment.yaml
        kubectl get pods --all-namespaces




      




  
   

   
  
       
  
   
      
      
      
       
       
      
   
        
          
       
       
       
        
      
